# ---------------------------------------------------------------------------
# databricks.yml — Declarative Automation Bundle (serverless workspace version)
#
# Pipeline: bronze -> silver -> gold -> train_model, on a weekly schedule,
# with email notifications on success/failure.
# Deploy with:  databricks bundle deploy -t dev
# ---------------------------------------------------------------------------

bundle:
  name: f1-race-predictor

variables:
  catalog:
    description: Unity Catalog to read/write in.
    default: workspace
  schema:
    description: Schema (database) that holds the F1 data + volume.
    default: f1
  seasons_to_backfill:
    description: Comma-separated seasons the bronze stage backfills.
    default: "2022,2023,2024,2025"
  notification_email:
    description: Address that receives job success/failure emails.
    default: your_email

resources:
  jobs:
    f1_pipeline:
      name: "F1 Race Predictor"

      # F1 races run on Sundays, so refresh every Monday at 06:00 US Eastern.
      # Paused here on purpose; the prod target below switches it on.
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/New_York
        pause_status: PAUSED

      # Email whenever a run finishes or fails. No secrets needed — this uses
      # Databricks' built-in job notifications. (Content is run status, not the
      # prediction itself.)
      email_notifications:
        on_success:
          - ${var.notification_email}
        on_failure:
          - ${var.notification_email}

      environments:
        - environment_key: f1_env
          spec:
            client: "3"
            dependencies:
              - "requests>=2.31"
              - "pyyaml>=6.0"
              - "scikit-learn>=1.4"
              - "joblib>=1.3"

      tasks:
        - task_key: bronze_ingest
          environment_key: f1_env
          spark_python_task:
            python_file: pipelines/run_bronze.py
            parameters:
              - "--bronze-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/bronze"
              - "--seasons"
              - "${var.seasons_to_backfill}"

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          environment_key: f1_env
          spark_python_task:
            python_file: pipelines/run_silver.py
            parameters:
              - "--bronze-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/bronze"
              - "--silver-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/silver"

        - task_key: gold_features
          depends_on:
            - task_key: silver_transform
          environment_key: f1_env
          spark_python_task:
            python_file: pipelines/run_gold.py
            parameters:
              - "--silver-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/silver"
              - "--gold-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/gold"

        - task_key: train_model
          depends_on:
            - task_key: gold_features
          environment_key: f1_env
          spark_python_task:
            python_file: pipelines/run_train.py
            parameters:
              - "--gold-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/gold"
              - "--model-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/models/win_model.joblib"
              - "--fmt"
              - "parquet"

targets:
  dev:
    mode: development
    default: true

prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/98jfry@gmail.com/.bundle/${bundle.name}/${bundle.target}
    resources:
      jobs:
        f1_pipeline:
          schedule:
            pause_status: UNPAUSED