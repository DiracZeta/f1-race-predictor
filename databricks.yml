# ---------------------------------------------------------------------------
# databricks.yml — Declarative Automation Bundle (serverless workspace version)
#
# Two jobs:
#   f1_pipeline    — Mon 06:00 ET: bronze -> silver -> gold -> train (+ status email)
#   f1_prediction  — Sat 20:00 ET: predict the upcoming race and email the ranking
# Deploy with:  databricks bundle deploy -t dev
# ---------------------------------------------------------------------------

bundle:
  name: f1-race-predictor

variables:
  catalog:
    description: Unity Catalog to read/write in.
    default: workspace
  schema:
    description: Schema (database) that holds the F1 data + volume.
    default: f1
  seasons_to_backfill:
    description: Comma-separated seasons the bronze stage backfills.
    default: "2022,2023,2024,2025"

resources:
  jobs:

    # -------- Weekly data + training pipeline --------
    f1_pipeline:
      name: "F1 Race Predictor"
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/New_York
        pause_status: PAUSED
      email_notifications:
        on_success:
          - ${var.notification_email}
        on_failure:
          - ${var.notification_email}
      environments:
        - environment_key: f1_env
          spec:
            client: "3"
            dependencies:
              - "requests>=2.31"
              - "pyyaml>=6.0"
              - "scikit-learn>=1.4"
              - "joblib>=1.3"
      tasks:
        - task_key: bronze_ingest
          environment_key: f1_env
          spark_python_task:
            python_file: pipelines/run_bronze.py
            parameters:
              - "--bronze-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/bronze"
              - "--seasons"
              - "${var.seasons_to_backfill}"
        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          environment_key: f1_env
          spark_python_task:
            python_file: pipelines/run_silver.py
            parameters:
              - "--bronze-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/bronze"
              - "--silver-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/silver"
        - task_key: gold_features
          depends_on:
            - task_key: silver_transform
          environment_key: f1_env
          spark_python_task:
            python_file: pipelines/run_gold.py
            parameters:
              - "--silver-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/silver"
              - "--gold-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/gold"
        - task_key: train_model
          depends_on:
            - task_key: gold_features
          environment_key: f1_env
          spark_python_task:
            python_file: pipelines/run_train.py
            parameters:
              - "--gold-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/gold"
              - "--model-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/models/win_model.joblib"
              - "--fmt"
              - "parquet"

    # -------- Weekly prediction + email --------
    # Saturday evening, after qualifying. Predicts the next race and emails the
    # ranking. Needs Databricks secrets in scope "f1": smtp_user, smtp_password,
    # notify_to. If qualifying isn't out yet, it logs and sends nothing.
    f1_prediction:
      name: "F1 Race Prediction (email)"
      schedule:
        quartz_cron_expression: "0 0 20 ? * SAT"
        timezone_id: America/New_York
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tasks:
        - task_key: predict_and_email
          notebook_task:
            notebook_path: notebooks/predict_and_email.py

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    resources:
      jobs:
        f1_pipeline:
          schedule:
            pause_status: UNPAUSED
        f1_prediction:
          schedule:
            pause_status: UNPAUSED