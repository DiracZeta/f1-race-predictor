# ---------------------------------------------------------------------------
# databricks.yml — Declarative Automation Bundle (serverless workspace version)
#
# This workspace only supports serverless compute, so there is no cluster
# definition here — Databricks manages compute automatically. Deploy with:
#   databricks bundle deploy -t dev
# ---------------------------------------------------------------------------

bundle:
  name: f1-race-predictor

variables:
  catalog:
    description: Unity Catalog to read/write in.
    default: workspace
  schema:
    description: Schema (database) that holds the F1 data + volume.
    default: f1
  seasons_to_backfill:
    description: Comma-separated seasons the bronze stage backfills.
    default: "2022,2023,2024,2025"

resources:
  jobs:
    f1_pipeline:
      name: "F1 Race Predictor"

      # F1 races run on Sundays, so refresh every Monday at 06:00 US Eastern.
      # Paused here on purpose; the prod target below switches it on.
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/New_York
        pause_status: PAUSED

      # Serverless dependencies are declared here and referenced by each task.
      environments:
        - environment_key: f1_env
          spec:
            client: "3"
            dependencies:
              - "requests>=2.31"
              - "pyyaml>=6.0"

      tasks:
        - task_key: bronze_ingest
          environment_key: f1_env
          spark_python_task:
            python_file: pipelines/run_bronze.py
            parameters:
              - "--bronze-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/bronze"
              - "--seasons"
              - "${var.seasons_to_backfill}"

        - task_key: silver_transform
          depends_on:
            - task_key: bronze_ingest
          environment_key: f1_env
          spark_python_task:
            python_file: pipelines/run_silver.py
            parameters:
              - "--bronze-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/bronze"
              - "--silver-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/silver"

        - task_key: gold_features
          depends_on:
            - task_key: silver_transform
          environment_key: f1_env
          spark_python_task:
            python_file: pipelines/run_gold.py
            parameters:
              - "--silver-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/silver"
              - "--gold-path"
              - "/Volumes/${var.catalog}/${var.schema}/f1_data/gold"

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    resources:
      jobs:
        f1_pipeline:
          schedule:
            pause_status: UNPAUSED
